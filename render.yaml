services:
  - type: web
    name: idiom-console
    runtime: go
    plan: free
    buildCommand: cd app && npm ci && npm run build && cd ../api-services && go build -o ../console-server ./cmd/console
    startCommand: ./console-server
    envVars:
      - key: DIST_DIR
        value: app/dist

  - type: web
    name: idiom-identity
    runtime: go
    plan: free
    buildCommand: cd api-services && go build -o ../auth-server ./cmd/auth
    startCommand: ./auth-server
