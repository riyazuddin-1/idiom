<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Idiom</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #172026;
            background: #f5f7f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-shell {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border: 1px solid #dfe6ea;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 16px 40px rgba(23, 32, 38, 0.08);
        }

        .auth-header {
            margin-bottom: 24px;
        }

        .auth-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.2;
        }

        .auth-header p {
            margin: 0;
            color: #5f6f78;
            font-size: 15px;
            line-height: 1.5;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 14px;
            font-weight: 700;
        }

        .field-error {
            min-height: 16px;
            color: #b42318;
            font-size: 13px;
            line-height: 1.2;
        }

        input {
            width: 100%;
            height: 44px;
            border: 1px solid #cbd6dc;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 15px;
            color: #172026;
            background: #ffffff;
        }

        input:focus {
            border-color: #216bff;
            outline: 3px solid rgba(33, 107, 255, 0.16);
        }

        button {
            height: 44px;
            border: 0;
            border-radius: 6px;
            background: #172026;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #26343d;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-footer {
            margin-top: 20px;
            text-align: center;
            color: #5f6f78;
            font-size: 14px;
        }

        .auth-footer a {
            color: #216bff;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .status-message {
            display: none;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .status-message.error {
            display: block;
            background: #fef3f2;
            color: #b42318;
            border: 1px solid #fecdca;
        }

        .status-message.success {
            display: block;
            background: #f0fdf4;
            color: #067647;
            border: 1px solid #abefc6;
        }

        @media (max-width: 520px) {
            .auth-shell {
                padding: 24px;
            }

            .field-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-header">
            <h1>Create account</h1>
            <p>Start using Idiom with your profile details.</p>
        </div>
        <div id="status" class="status-message"></div>
        <form class="auth-form" id="registerForm" action="/api/v1/{{.ProjectID}}/register" method="POST">
            <div class="field-row">
                <div class="field">
                    <label for="first_name">First name</label>
                    <input id="first_name" type="text" name="first_name" placeholder="First name" autocomplete="given-name">
                </div>
                <div class="field">
                    <label for="last_name">Last name</label>
                    <input id="last_name" type="text" name="last_name" placeholder="Last name" autocomplete="family-name">
                </div>
            </div>
            <div class="field">
                <label for="display_name">Display name</label>
                <input id="display_name" type="text" name="display_name" placeholder="Display name" autocomplete="nickname">
            </div>
            <div class="field">
                <label for="avatar_url">Avatar URL</label>
                <input id="avatar_url" type="url" name="avatar_url" placeholder="https://example.com/avatar.png" autocomplete="url">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="user@example.com" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Password" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="confirm_password">Confirm password</label>
                <input id="confirm_password" type="password" name="confirm_password" placeholder="Confirm password" autocomplete="new-password" required>
                <span id="confirm_password_error" class="field-error" aria-live="polite"></span>
            </div>
            <button type="submit" id="submitBtn">Create account</button>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="/{{.ProjectID}}/login">Log in</a>
        </div>
    </div>
    <script>
        const form = document.getElementById("registerForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm_password");
        const confirmPasswordError = document.getElementById("confirm_password_error");
        const statusEl = document.getElementById("status");
        const submitBtn = document.getElementById("submitBtn");

        function showStatus(message, type) {
            statusEl.textContent = message;
            statusEl.className = "status-message " + type;
        }

        function validatePasswordMatch() {
            const mismatch = confirmPassword.value !== "" && password.value !== confirmPassword.value;
            const message = mismatch ? "Passwords do not match." : "";

            confirmPassword.setCustomValidity(message);
            confirmPasswordError.textContent = message;

            return !mismatch;
        }

        password.addEventListener("input", validatePasswordMatch);
        confirmPassword.addEventListener("input", validatePasswordMatch);

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            if (!validatePasswordMatch()) {
                return;
            }

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            submitBtn.disabled = true;
            statusEl.className = "status-message";
            confirmPassword.disabled = true;

            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        first_name: formData.get("first_name"),
                        last_name: formData.get("last_name"),
                        display_name: formData.get("display_name"),
                        avatar_url: formData.get("avatar_url"),
                        email: formData.get("email"),
                        password: formData.get("password"),
                    }),
                });

                const result = await response.json();

                if (result.success) {
                    showStatus(result.message || "Account created successfully. You can now log in.", "success");
                    form.reset();
                    setTimeout(function () {
                        window.location.href = "/{{.ProjectID}}/login";
                    }, 2000);
                } else {
                    showStatus(result.message || "Registration failed. Please try again.", "error");
                }
            } catch (err) {
                showStatus("An unexpected error occurred. Please try again.", "error");
            } finally {
                submitBtn.disabled = false;
                confirmPassword.disabled = false;
            }
        });
    </script>
</body>
</html>
