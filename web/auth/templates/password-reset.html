<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset | Idiom</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #172026;
            background: #f5f7f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-shell {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border: 1px solid #dfe6ea;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 16px 40px rgba(23, 32, 38, 0.08);
        }

        .auth-header {
            margin-bottom: 24px;
        }

        .auth-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.2;
        }

        .auth-header p {
            margin: 0;
            color: #5f6f78;
            font-size: 15px;
            line-height: 1.5;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 44px;
            border: 1px solid #cbd6dc;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 15px;
            color: #172026;
            background: #ffffff;
        }

        input:focus {
            border-color: #216bff;
            outline: 3px solid rgba(33, 107, 255, 0.16);
        }

        button {
            height: 44px;
            border: 0;
            border-radius: 6px;
            background: #172026;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #26343d;
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-header">
            <h1>Reset password</h1>
            <p>Enter a new password for your account.</p>
        </div>
        <form class="auth-form" action="/auth/v1/password-reset" method="POST">
            <input type="hidden" name="scope" value="{{.Scope}}">
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="New password" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="confirm_password">Confirm password</label>
                <input id="confirm_password" type="password" name="confirm_password" placeholder="Confirm password" autocomplete="new-password" required>
            </div>
            <button type="submit">Update password</button>
        </form>
    </div>
</body>
</html>
