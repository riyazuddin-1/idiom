<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Idiom</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #172026;
            background: #f5f7f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-shell {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border: 1px solid #dfe6ea;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 16px 40px rgba(23, 32, 38, 0.08);
        }

        .auth-header {
            margin-bottom: 24px;
        }

        .auth-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
            line-height: 1.2;
        }

        .auth-header p {
            margin: 0;
            color: #5f6f78;
            font-size: 15px;
            line-height: 1.5;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 14px;
            font-weight: 700;
        }

        .field-error {
            min-height: 16px;
            color: #b42318;
            font-size: 13px;
            line-height: 1.2;
        }

        input {
            width: 100%;
            height: 44px;
            border: 1px solid #cbd6dc;
            border-radius: 6px;
            padding: 0 12px;
            font-size: 15px;
            color: #172026;
            background: #ffffff;
        }

        input:focus {
            border-color: #216bff;
            outline: 3px solid rgba(33, 107, 255, 0.16);
        }

        button {
            height: 44px;
            border: 0;
            border-radius: 6px;
            background: #172026;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #26343d;
        }

        .auth-footer {
            margin-top: 20px;
            text-align: center;
            color: #5f6f78;
            font-size: 14px;
        }

        .auth-footer a {
            color: #216bff;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            .auth-shell {
                padding: 24px;
            }

            .field-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-header">
            <h1>Create account</h1>
            <p>Start using Idiom with your profile details.</p>
        </div>
        <form class="auth-form" action="/api/v1/register" method="POST">
            <div class="field-row">
                <div class="field">
                    <label for="first_name">First name</label>
                    <input id="first_name" type="text" name="first_name" placeholder="First name" autocomplete="given-name">
                </div>
                <div class="field">
                    <label for="last_name">Last name</label>
                    <input id="last_name" type="text" name="last_name" placeholder="Last name" autocomplete="family-name">
                </div>
            </div>
            <div class="field">
                <label for="display_name">Display name</label>
                <input id="display_name" type="text" name="display_name" placeholder="Display name" autocomplete="nickname">
            </div>
            <div class="field">
                <label for="avatar_url">Avatar URL</label>
                <input id="avatar_url" type="url" name="avatar_url" placeholder="https://example.com/avatar.png" autocomplete="url">
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="user@example.com" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Password" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label for="confirm_password">Confirm password</label>
                <input id="confirm_password" type="password" name="confirm_password" placeholder="Confirm password" autocomplete="new-password" required>
                <span id="confirm_password_error" class="field-error" aria-live="polite"></span>
            </div>
            <button type="submit">Create account</button>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="/web/login">Log in</a>
        </div>
    </div>
    <script>
        const form = document.querySelector(".auth-form");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirm_password");
        const confirmPasswordError = document.getElementById("confirm_password_error");

        function validatePasswordMatch() {
            const mismatch = confirmPassword.value !== "" && password.value !== confirmPassword.value;
            const message = mismatch ? "Passwords do not match." : "";

            confirmPassword.setCustomValidity(message);
            confirmPasswordError.textContent = message;

            return !mismatch;
        }

        password.addEventListener("input", validatePasswordMatch);
        confirmPassword.addEventListener("input", validatePasswordMatch);

        form.addEventListener("submit", function (event) {
            validatePasswordMatch();

            if (!form.checkValidity()) {
                event.preventDefault();
                form.reportValidity();
                return;
            }

            confirmPassword.disabled = true;
        });
    </script>
</body>
</html>
